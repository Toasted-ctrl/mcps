apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: mcp-example-ingress
  namespace: mcp-example
spec:
  ingressClassName: nginx
  rules:
    - host: mcp-example.k8s.internal
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: mcp-example-service
                port:
                  number: 80